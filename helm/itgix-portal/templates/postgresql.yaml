{{- $postgresql := default dict .Values.postgresql -}}
{{- if $postgresql.enabled }}
{{- $portal := index .Values "itgix-portal" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-postgresql
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: {{ .Release.Name }}-postgresql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-postgresql
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  serviceName: {{ .Release.Name }}-postgresql
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-postgresql
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-postgresql
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgresql
          image: {{ $postgresql.image | quote }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ $portal.cm.env.DB_NAME | quote }}
            - name: POSTGRES_USER
              value: {{ $portal.cm.env.DB_USERNAME | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $portal.appId }}-external-secret
                  key: DB_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: [sh, -ec, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
{{- if $postgresql.storageClassName }}
        storageClassName: {{ $postgresql.storageClassName | quote }}
{{- end }}
        resources:
          requests:
            storage: {{ $postgresql.storageSize | quote }}
{{- end }}
